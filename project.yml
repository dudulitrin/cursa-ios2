name: Cursa
options:
  deploymentTarget:
    iOS: '16.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    TARGETED_DEVICE_FAMILY: '1'
    MARKETING_VERSION: '0.1.0'
    CURRENT_PROJECT_VERSION: '1'
    CURSA_GROUP: group.ro.cursa.prototype
targets:
  Cursa:
    type: application
    platform: iOS
    sources: [App, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.cursa.prototype
    info:
      path: Generated/App-Info.plist
      properties:
        CFBundleDisplayName: Cursa
        UILaunchScreen: {}
        UIBackgroundModes: [audio]
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        CursaAppGroup: $(CURSA_GROUP)
    entitlements:
      path: Generated/App.entitlements
      properties:
        com.apple.security.application-groups: [$(CURSA_GROUP)]
    dependencies:
      - target: Broadcast
        embed: true
  Broadcast:
    type: app-extension
    platform: iOS
    sources: [Broadcast, Shared]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ro.cursa.prototype.Broadcast
        APPLICATION_EXTENSION_API_ONLY: YES
        SKIP_INSTALL: YES
    info:
      path: Generated/Broadcast-Info.plist
      properties:
        CFBundleDisplayName: Cursa Capture
        CursaAppGroup: $(CURSA_GROUP)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.broadcast-services-upload
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).SampleHandler
          RPBroadcastProcessMode: RPBroadcastProcessModeSampleBuffer
    entitlements:
      path: Generated/Broadcast.entitlements
      properties:
        com.apple.security.application-groups: [$(CURSA_GROUP)]
schemes:
  Cursa:
    build:
      targets:
        Cursa: all
